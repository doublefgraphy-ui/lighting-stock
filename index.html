<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LIGHTING STOCK">
  <title>LIGHTING STOCK</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header class="topbar">
    <button class="brand-home" id="homeBtn" type="button" aria-label="맨 위로 이동">
      <span class="eyebrow">DUOMO</span>
      <span class="title">LIGHTING STOCK</span>
    </button>
    <button id="resetBtn" class="reset-btn" type="button">초기화</button>
  </header>

  <main class="wrap">
    <section class="search-panel">
      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="제품명, 브랜드, 옵션, 코드, 비고 검색">
        <button id="clearSearch" aria-label="검색어 지우기" type="button">×</button>
      </div>

      <div class="filters">
        <select id="brandFilter" aria-label="브랜드"><option value="">전체 브랜드</option></select>
        <select id="typeFilter" aria-label="제품 유형"><option value="">전체 유형</option></select>
        <select id="stockFilter" aria-label="재고 상태">
          <option value="">재고 상태 전체</option>
          <option value="in">재고 있음</option>
          <option value="low">5개 이하</option>
          <option value="out">품절</option>
          <option value="unknown">미표기</option>
        </select>
        <select id="sheetFilter" aria-label="원본 구분"><option value="">전체 구분</option></select>
      </div>

      <div class="summary" aria-live="polite">
        <div><strong id="shownCount">0</strong><span>검색 결과</span></div>
        <div><strong id="inCount">0</strong><span>재고 있음</span></div>
        <div><strong id="outCount">0</strong><span>품절</span></div>
        <p id="updated"></p>
      </div>
    </section>

    <section id="results" class="product-list"></section>

    <section id="empty" class="empty-state" hidden>
      <strong>검색 결과가 없습니다.</strong>
      <span>검색어나 필터를 다시 확인해주세요.</span>
    </section>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <button class="dialog-close" type="button" aria-label="닫기">×</button>
    <div id="dialogBody"></div>
  </dialog>

  <button id="topBtn" class="top-btn" type="button" aria-label="맨 위로">↑</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
